version: "3.8"

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: jy-admin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    # 暴露端口到主机（用于本地开发连接）
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./server/mysql/conf.d:/etc/mysql/conf.d:ro
    command:
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    networks:
      - jy-admin-network
    mem_limit: 1g # 内存限制：1GB
    memswap_limit: 2g # 内存+Swap 限制：2GB（允许使用 1GB Swap）
    cpus: 1.0 # CPU 限制：1 核
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jy-admin-backend
    restart: always
    environment:
      GIN_MODE: release
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LONGCAT_APP_KEY: ${LONGCAT_APP_KEY}
      LONGCAT_MODEL: ${LONGCAT_MODEL}
      AI_SERVER_URL: ${AI_SERVER_URL}
    # ⚠️ 不暴露端口到主机，只在 Docker 网络内访问
    ports:
      - "7777:7777"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jy-admin-network
    mem_limit: 512m # 内存限制：512MB
    memswap_limit: 1g # 内存+Swap 限制：1GB（允许使用 512MB Swap）
    cpus: 1.0 # CPU 限制：1 核
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:7777/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # 前端服务（Nginx）
  # 注意：使用本地构建产物，需在本地先执行 pnpm build
  # 如需在服务器构建，恢复为 packages/web/Dockerfile
  frontend:
    build:
      context: ./web
      dockerfile: packages/web/Dockerfile
    container_name: jy-admin-frontend
    restart: always
    ports:
      - "80:80" # 前端服务端口（注意：80端口需要root权限）
      - "443:443" # 前端服务端口（注意：443端口需要root权限）
    volumes:
      # 证书目录：宿主机 ./certs 挂载到容器 /etc/nginx/certs（勿提交 certs/ 到仓库）
      - ./web/packages/web/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - jy-admin-network
    mem_limit: 256m # 内存限制：256MB（Nginx 占用很少）
    memswap_limit: 512m # 内存+Swap 限制：512MB（允许使用 256MB Swap）
    cpus: 0.5 # CPU 限制：0.5 核
  # 向量数据库（PostgreSQL + pgvector）
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: jy-admin-pgvector
    restart: always
    environment:
      POSTGRES_DB: ai_vectors
      POSTGRES_USER: ai_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ai123456}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - jy-admin-network
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_admin -d ai_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI 服务（FastAPI + LangChain + PGVector）
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: jy-admin-ai-server
    restart: always
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh}
      HF_ENDPOINT: https://hf-mirror.com
      PG_HOST: postgres-vector
      PG_PORT: 5432
      PG_DB: ai_vectors
      PG_USER: ai_admin
      PG_PASSWORD: ${PG_PASSWORD:-ai123456}
    # 不暴露端口到宿主机，仅 Docker 内网访问（Go 后端通过 http://ai-server:8000 调用）
    # 如需临时调试 ai-server，取消下面注释
    # ports:
    #   - "8000:8000"
    volumes:
      - ai_uploads:/app/uploads
    depends_on:
      postgres-vector:
        condition: service_healthy
    extra_hosts:
      - "api.longcat.chat:101.50.8.136"
    networks:
      - jy-admin-network
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 1.0

  # msfz:
  #   build:
  #     context: ./web
  #     dockerfile: packages/msfz/Dockerfile
  #     # 启用构建缓存
  #     args:
  #       BUILDKIT_INLINE_CACHE: 1
  #   container_name: jy-admin-msfz
  #   restart: always
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     # 证书目录：宿主机 ./certs 挂载到容器 /etc/nginx/certs（勿提交 certs/ 到仓库）
  #     - ./web/packages/msfz/certs:/etc/nginx/certs:ro
  #   networks:
  #     - jy-admin-network
  #   mem_limit: 256m
  #   cpus: 0.5
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
  #     interval: 30s
  #     timeout: 3s
  #     retries: 3
  #     start_period: 10s

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  pgvector_data:
    driver: local
  ai_uploads:
    driver: local

networks:
  jy-admin-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 900
