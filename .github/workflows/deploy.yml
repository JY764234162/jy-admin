name: Deploy to Server

# 触发条件
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 并发控制
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true


# 任务
jobs:
  # 部署任务
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull + deploy.sh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_PATH }}"

            # 拉取最新代码（已设置 upstream 时可直接 git pull）
            git checkout -f main
            git pull --ff-only

            # 可选：清理未跟踪文件，保证环境干净（如不需要可注释）
            git clean -fd

            # 执行部署脚本（会负责 docker compose up -d --build）
            chmod +x ./deploy.sh
            ./deploy.sh

