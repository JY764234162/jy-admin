name: Deploy to Server

# 触发条件
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 并发控制
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true


# 任务
jobs:
  # 部署任务
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) 在 GitHub Runner 上拉取最新代码
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2) 将代码同步到服务器（避免服务器访问 GitHub）
      - name: Sync project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: ${{ secrets.SERVER_PATH }}
          rm: true
          overwrite: true
          strip_components: 1

      # 3) SSH 到服务器执行 deploy.sh（不再 git pull）
      - name: Deploy via SSH (deploy.sh only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          JWT_SIGNING_KEY:     ${{ secrets.JWT_SIGNING_KEY }}
          MYSQL_PASSWORD:      ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE:      ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER:          ${{ secrets.MYSQL_USER }}
          COS_SECRET_ID:       ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY:      ${{ secrets.COS_SECRET_KEY }}
          LONGCAT_APP_KEY:     ${{ secrets.LONGCAT_APP_KEY }}
          LONGCAT_MODEL:       ${{ vars.LONGCAT_MODEL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          #  ssh私钥(需要本地生成私钥并添加到github仓库的secrets中)
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: >
            JWT_SIGNING_KEY,MYSQL_PASSWORD,MYSQL_ROOT_PASSWORD,
            MYSQL_DATABASE,MYSQL_USER,
            COS_SECRET_ID,COS_SECRET_KEY,
            LONGCAT_APP_KEY,LONGCAT_MODEL
          script: |
            set -euo pipefail

            cd "${{ secrets.SERVER_PATH }}"
            chmod +x ./deploy.sh
            ./deploy.sh

