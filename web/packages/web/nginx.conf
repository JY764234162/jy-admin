server {
    listen 80;
    server_name jy_admin.site;
    # HTTP 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jy_admin.site;

    ssl_certificate /etc/nginx/certs/jy-admin.site_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/jy-admin.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（对静态资源与 JSON 等生效）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject
        application/font-woff
        font/woff
        font/woff2;

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端 API 代理（支持 WebSocket）
    location /api/ {
        proxy_pass http://backend:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
    }

    # 基金数据接口代理到东方财富，保持与前端 /api-fund 前缀一致
    location /api-fund/ {
        proxy_pass https://api.fund.eastmoney.com/;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host api.fund.eastmoney.com;
        proxy_ssl_server_name on;
    }

    location /api/health {
        proxy_pass http://backend:7777/api/health;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}


