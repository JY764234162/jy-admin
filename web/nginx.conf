# HTTPS：证书挂载到容器 /etc/nginx/certs/（宿主机 ./certs）
server {
    listen 443 ssl;
    server_name jy_admin.site;

    ssl_certificate     /etc/nginx/certs/jy-admin.site_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/jy-admin.site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://backend:7777;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /msfz/ {
        return 302 $scheme://$host:8080$request_uri;
    }

    location /api/health {
        proxy_pass http://backend:7777/api/health;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTP：强制跳转到 HTTPS
server {
    listen 80;
    server_name jy_admin.site;
    return 301 https://$host$request_uri;
}
